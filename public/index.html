<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Konva with Quill HTML - TypeScript</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f0f0f0;
    }
    #editor-container {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      width: 500px;
      background-color: white;
      z-index: 10;
      border: 1px solid #ccc;
    }
    #add {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
    }
    #container {
      width: 100%;
      height: 100vh;
    }
  </style>
  <!-- Quill 스타일시트 -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
  <div id="editor-container">
    <div id="editor"></div>
  </div>
  <button id="add">Add to canvas</button>
  <div id="container"></div>
  
  <!-- 스크립트 로드 -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="https://unpkg.com/konva@8/konva.min.js"></script>
  <!-- 타입스크립트로 컴파일된 자바스크립트를 여기에 로드 -->
  <script src="app.js"></script>
</body>
</html>
